name: Cypress Tests

on:
  push:
  workflow_dispatch:
  schedule:
    # Daily at 9:00 AM IST
    - cron: '30 3 * * *'

    # Weekly on Monday at 11:00 AM IST
    - cron: '30 5 * * 1'

    # Alternate days at 2:00 PM IST
    - cron: '30 8 */2 * *'

jobs:
  cypress-run:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Install npm dependencies, cache them correctly
      # and run all Cypress tests
      - name: Cypress run in ${{ matrix.browser }}
        uses: cypress-io/github-action@v6
        with:
          browser: ${{ matrix.browser }}
          command: npx cypress run --browser ${{ matrix.browser }} --reporter-options reportDir=cypress/reports/${{ matrix.browser }}

      - name: Mochawesome merge reports for ${{ matrix.browser }}
        run: npx mochawesome-merge cypress/reports/${{ matrix.browser }}/*.json > cypress/reports/${{ matrix.browser }}/merged-reports.json

      - name: Generate Mochawesome HTML report for ${{ matrix.browser }}
        run: npx marge cypress/reports/${{ matrix.browser }}/merged-reports.json --reportDir cypress/reports/${{ matrix.browser }} -f "${{ matrix.browser }}-reports.html"

      - name: Upload Mochawesome report artifact for ${{ matrix.browser }}
        uses: actions/upload-artifact@v4
        with:
          name: Cypress HTML Report ${{ matrix.browser }}
          path: cypress/reports/${{ matrix.browser }}